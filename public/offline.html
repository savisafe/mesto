<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#4f46e5" />
        <title>Нет соединения — Mesto</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: Arial, Helvetica, sans-serif;
                color: #fff;
                background: linear-gradient(135deg, #4f46e5 0%, #9333ea 55%, #ec4899 100%);
            }
            .card {
                max-width: 28rem;
                padding: 2rem;
                text-align: center;
            }
            img {
                width: 96px;
                height: 96px;
                margin-bottom: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
                margin: 0 0 0.75rem;
            }
            p {
                margin: 0 0 1.5rem;
                opacity: 0.9;
                line-height: 1.5;
            }
            button {
                cursor: pointer;
                border: 0;
                border-radius: 0.75rem;
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
                font-weight: 600;
                color: #4f46e5;
                background: #fff;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="/icons/icon-192.png" alt="Mesto" />
            <h1>Нет подключения к интернету</h1>
            <p>
                Похоже, соединение пропало. Проверьте сеть и попробуйте снова —
                Mesto вернётся, как только связь восстановится.
            </p>
            <button onclick="location.reload()">Повторить</button>
        </div>
    </body>
</html>
