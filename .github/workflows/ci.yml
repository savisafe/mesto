name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Test
        run: npm test

      - name: Build
        # DATABASE_URL не нужен — наш db client ленивый.
        # NEXT_TELEMETRY_DISABLED убирает баннеры в логах.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
